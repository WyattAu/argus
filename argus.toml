# argus — M1 configuration.
# Layers: this file -> ARGUS_ env overrides (config-kit).

[server]
host = "127.0.0.1"
port = 8420
# Empty list allows all origins (fine for localhost M0). Set real origins before
# exposing beyond loopback — ws-kit enforces exact-match CSWSH protection.
ws_allowed_origins = []

[feeds]
sim_enabled = true
sim_interval_ms = 500
usgs_enabled = true
usgs_interval_secs = 60
eonet_enabled = true
eonet_interval_secs = 300
swpc_enabled = true
swpc_interval_secs = 120
nvd_enabled = true
nvd_interval_secs = 120
news_enabled = true
news_interval_secs = 300
# FIRMS needs a free MAP_KEY: https://firms.modaps.eosdis.nasa.gov/api/area/
firms_enabled = false
firms_map_key = ""      # or ARGUS_FEEDS_FIRMS_MAP_KEY
firms_interval_secs = 300

[markets]
binance_ws_enabled = true
binance_symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT"]
binance_klines_enabled = true
binance_klines_interval = "1m"
binance_klines_limit = 300
binance_klines_refresh_secs = 30
# Alpaca needs key+secret (free IEX feed): https://alpaca.markets
alpaca_enabled = false
alpaca_key_id = ""      # or ARGUS_MARKETS_ALPACA_KEY_ID
alpaca_secret = ""      # or ARGUS_MARKETS_ALPACA_SECRET
alpaca_symbols = ["AAPL"]
alpaca_interval_secs = 15

[auth]
# Empty = dev header mode (x-argus-role trusted). Set a secret (or
# ARGUS_AUTH_JWT_SECRET) to require Bearer tokens minted via
# POST /api/v1/auth/token with the x-argus-mint-key header.
jwt_secret = ""
issuer = "argus"

[alerts]
# Telegram delivery (or ARGUS_ALERTS_TELEGRAM_BOT_TOKEN/_CHAT_ID).
telegram_bot_token = ""
telegram_chat_id = ""

[[alerts.rules]]
id = "quake-major"
name = "M4.5+ earthquake"
source = "usgs"
kind = "quake"
condition = { type = "magnitude_at_least", value = 4.5 }
cooldown_secs = 900

[[alerts.rules]]
id = "btc-90k"
name = "BTC above 90k"
source = "binance"
symbol = "BTCUSDT"
condition = { type = "price_above", value = 90000 }
cooldown_secs = 3600

[telemetry]
level = "info"
