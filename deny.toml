# Dependency governance — cargo-deny (estate policy, engineering-standards §7).
# Keep the allow list tight: add a license only with a documented precedent.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  # BSL-1.0 — permissive Boost license (bundled headers, e.g. redis's xxhash).
  "BSL-1.0",
  # MPL-2.0 — weak file-level copyleft, linkable.
  "MPL-2.0",
  "CC0-1.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
