[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Wyatt Au <wyatt_au@protonmail.com>"]
repository = "https://github.com/WyattAu/argus"

# Estate tier-a lint posture (mirrors OmniRust-template): deny the panic family,
# take pedantic seriously, register the loom cfg for shared CI's model-check job.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"

[workspace.dependencies]
# Estate crates — dogfooded from crates.io (pinned to current stable).
eventbus-kit = "0.4.0"
ws-kit = "1.0.1"
healthkit = "1.3.2"
config-kit = "1.0.0"
telemetry-init = "0.1.3"
api-types = "0.1.1"
http-error = "0.2.0"
fetch-kit = { version = "0.2.1", features = ["circuit-breaker"] }
breaker = "2.0.2"
plycore = "0.2"
accessctl = "0.1.3"
tokenkit = "1.0"
double-entry = "0.1"
report-kit = "0.2"
fx-kit = "0.1"
vat-rules = "0.1"

# External.
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
thiserror = "2"
http = "1"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
ratatui = "0.30"
crossterm = "0.29"
tui-actions = "0.1"
petgraph = { version = "0.8", features = ["graphmap"] }
sha2 = "0.10"
tantivy = "0.27"

# Internal.
feedkit = { path = "crates/feedkit", version = "0.1.0" }
mdkit = { path = "crates/mdkit", version = "0.1.0" }
graphkit = { path = "crates/graphkit", version = "0.1.0" }
ontokit = { path = "crates/ontokit", version = "0.1.0" }
alertkit = { path = "crates/alertkit", version = "0.1.0" }

[profile.release]
lto = "thin"
codegen-units = 1
